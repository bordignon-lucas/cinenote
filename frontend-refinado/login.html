<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineNote — Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">

    <div class="login-container">
        <h1 class="login-titulo">CineNote</h1>
        <p class="login-subtitulo">Sua watchlist pessoal de filmes e séries.</p>

        <div class="login-abas">
            <button class="login-aba ativa" id="aba-entrar" type="button">Entrar</button>
            <button class="login-aba" id="aba-criar" type="button">Criar conta</button>
        </div>

        <form id="form-entrar" class="login-form">
            <div class="campo">
                <label for="login-email">E-mail</label>
                <input id="login-email" type="email" required autocomplete="username">
            </div>
            <div class="campo">
                <label for="login-senha">Senha</label>
                <input id="login-senha" type="password" required autocomplete="current-password">
            </div>
            <span class="login-erro" id="erro-entrar" hidden></span>
            <button class="btn-login" type="submit">Entrar</button>
        </form>

        <form id="form-criar" class="login-form" hidden>
            <div class="campo">
                <label for="criar-nome">Nome</label>
                <input id="criar-nome" type="text" required autocomplete="name">
            </div>
            <div class="campo">
                <label for="criar-email">E-mail</label>
                <input id="criar-email" type="email" required autocomplete="username">
            </div>
            <div class="campo">
                <label for="criar-senha">Senha (mínimo 6 caracteres)</label>
                <input id="criar-senha" type="password" required minlength="6" autocomplete="new-password">
            </div>
            <span class="login-erro" id="erro-criar" hidden></span>
            <button class="btn-login" type="submit">Criar conta</button>
        </form>
    </div>

    <script src="login.js"></script>

</body>
</html>
