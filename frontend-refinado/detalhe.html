<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineNote — Detalhes</title>
    <script>
        // Essa página agora também é aberta em endereços como
        // "/detalhe/<código>" (URL limpa) — sem isso, o navegador tentaria
        // buscar "style.css" dentro de uma pasta "detalhe" que não existe.
        // Isso escreve o caminho certo antes do arquivo ser carregado: com
        // "/" na frente quando servido pelo backend, e sem "/" (relativo)
        // quando a página é aberta direto do disco (file://) em testes locais.
        document.write(
            '<link rel="stylesheet" href="' +
            (location.protocol === "file:" ? "" : "/") +
            'style.css">'
        );
    </script>
</head>

<body>

    <header>
        <h1>CineNote</h1>
    </header>

    <main>
        <a class="btn-voltar" href="/">← Voltar para a lista</a>

        <section class="secao" id="secao-detalhe">
            <p id="carregando">Carregando...</p>
        </section>
    </main>

    <script>
        // Mesmo motivo do style.css acima: garante que "detalhe.js" seja
        // encontrado independente da URL usada para abrir essa página.
        document.write(
            '<script src="' +
            (location.protocol === "file:" ? "" : "/") +
            'detalhe.js"><' + '/script>'
        );
    </script>

</body>
</html>
