<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineNote — Detalhes</title>
    <script>
        // Essa página também abre em endereços como "/detalhe/<código>" —
        // sem isso, o navegador tentaria buscar o style.css dentro de uma
        // pasta "detalhe" que não existe. Aqui a gente escreve o caminho
        // certo antes do arquivo carregar.
        document.write(
            '<link rel="stylesheet" href="' +
            (location.protocol === "file:" ? "" : "/") +
            'style.css">'
        );
    </script>
</head>

<body>

    <header>
        <h1>CineNote</h1>
    </header>

    <main>
        <a class="btn-voltar" href="/">← Voltar para a lista</a>

        <section class="secao" id="secao-detalhe">
            <p id="carregando">Carregando...</p>
        </section>
    </main>

    <script>
        // Mesma ideia do style.css acima: garante que o detalhe.js seja
        // encontrado, não importa qual URL abriu essa página.
        document.write(
            '<script src="' +
            (location.protocol === "file:" ? "" : "/") +
            'detalhe.js"><' + '/script>'
        );
    </script>

</body>
</html>
